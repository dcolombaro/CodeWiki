<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <title>{{TITLE}}</title>
  <style>
    :root { color-scheme: light; --ink:#243247; --muted:#64748b; --line:#dce3eb; --paper:#fff; --panel:#f5f8fc; --accent:#ce5b12; --code:#f2f5f9; }
    * { box-sizing:border-box; }
    html { scroll-behavior:smooth; }
    body { margin:0; font:15px/1.65 system-ui,-apple-system,Segoe UI,Roboto,sans-serif; color:var(--ink); background:var(--paper); }
    a { color:#1459a0; }
    a:hover { color:var(--accent); }
    .layout { display:grid; grid-template-columns:290px minmax(0,1fr) 220px; min-height:100vh; }
    .sidebar { position:sticky; top:0; height:100vh; overflow:auto; border-right:1px solid var(--line); background:var(--panel); padding:26px 16px; }
    .brand { display:block; padding:0 10px 18px; color:var(--ink); text-decoration:none; border-bottom:1px solid var(--line); }
    .brand strong { display:block; font-size:18px; line-height:1.2; }
    .brand span { color:var(--muted); font-size:12px; }
    #nav-filter { width:100%; margin:20px 0; padding:9px 11px; border:1px solid var(--line); border-radius:8px; background:var(--paper); font:inherit; }
    .nav-section { margin:13px 0 18px; }
    .nav-heading,.nav-section summary { margin:0 8px 8px; color:var(--muted); font-size:11px; font-weight:750; text-transform:uppercase; letter-spacing:.08em; }
    .nav-section summary { cursor:pointer; }
    .count { float:right; }
    .nav-link { display:block; padding:7px 10px; border-radius:7px; color:var(--ink); text-decoration:none; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
    .nav-link:hover { background:#e9f0f9; }
    .nav-link.active { background:#dceafa; color:#123e72; font-weight:650; }
    .nav-link.hidden { display:none; }
    .main { min-width:0; padding:28px clamp(20px,4vw,64px) 80px; }
    .toolbar { display:flex; align-items:center; gap:12px; justify-content:space-between; border-bottom:1px solid var(--line); padding-bottom:16px; margin-bottom:28px; }
    .eyebrow { color:var(--accent); font-size:11px; font-weight:750; letter-spacing:.09em; text-transform:uppercase; }
    #page-title { margin:3px 0 0; font-size:21px; line-height:1.3; }
    .raw-link { font-size:12px; white-space:nowrap; }
    .content { max-width:920px; overflow-wrap:anywhere; }
    .content h1,.content h2,.content h3,.content h4 { line-height:1.25; scroll-margin-top:20px; }
    .content h1 { font-size:2rem; margin:0 0 24px; }
    .content h2 { font-size:1.45rem; margin-top:42px; padding-bottom:7px; border-bottom:1px solid var(--line); }
    .content h3 { font-size:1.15rem; margin-top:30px; }
    .content p,.content ul,.content ol { margin:13px 0; }
    .content li { margin:3px 0; }
    .content pre,.source-metadata pre { background:var(--code); padding:16px; border:1px solid var(--line); border-radius:8px; overflow:auto; white-space:pre; font-size:12px; line-height:1.5; }
    .content code { padding:.1em .3em; border-radius:3px; background:var(--code); font-size:.9em; }
    .content pre code { padding:0; background:transparent; }
    .content blockquote { margin:18px 0; padding:2px 18px; border-left:4px solid #9bb9d9; color:#475569; }
    .content table { display:block; overflow:auto; border-collapse:collapse; max-width:100%; margin:20px 0; font-size:13px; }
    .content th,.content td { padding:9px 12px; border:1px solid var(--line); text-align:left; vertical-align:top; }
    .content th { background:var(--panel); }
    .source-metadata { margin:0 0 24px; border:1px solid var(--line); border-radius:8px; padding:9px 12px; }
    .source-metadata summary { cursor:pointer; font-weight:650; }
    .source-metadata pre { white-space:pre-wrap; margin-bottom:0; }
    .image-note { color:var(--muted); }
    .toc { position:sticky; top:0; max-height:100vh; overflow:auto; padding:35px 20px 20px 0; font-size:12px; }
    .toc-heading { color:var(--muted); font-size:11px; font-weight:750; text-transform:uppercase; letter-spacing:.08em; margin-bottom:10px; }
    .toc a { display:block; color:var(--muted); text-decoration:none; padding:4px 0; }
    .toc a:hover { color:var(--accent); }
    .toc .depth-3 { padding-left:12px; }
    #menu-button { display:none; border:1px solid var(--line); background:var(--paper); border-radius:6px; padding:5px 9px; font:inherit; }
    @media (max-width:1100px) { .layout { grid-template-columns:260px minmax(0,1fr); } .toc { display:none; } }
    @media (max-width:700px) { .layout { display:block; } .sidebar { display:none; position:fixed; z-index:10; width:min(85vw,330px); box-shadow:0 0 0 100vw #0006; } .sidebar.open { display:block; } .main { padding:18px 20px 60px; } #menu-button { display:block; } .toolbar { justify-content:flex-start; } .raw-link { margin-left:auto; } }
  </style>
</head>
<body>
  <div class="layout">
    <nav class="sidebar" id="sidebar" aria-label="Wiki navigation">
      <a class="brand" href="#/docs%2Foverview.md"><strong>PEGA CodeWiki</strong><span>{{PROJECT}}</span></a>
      <input id="nav-filter" type="search" placeholder="Filter pages" aria-label="Filter pages">
      {{NAVIGATION}}
    </nav>
    <main class="main">
      <div class="toolbar"><button id="menu-button" type="button" aria-label="Open navigation">☰</button><div><div class="eyebrow" id="page-kind"></div><h1 id="page-title"></h1></div><a class="raw-link" id="raw-link">Raw Markdown</a></div>
      <article class="content" id="content"></article>
    </main>
    <aside class="toc" id="toc" aria-label="On this page"></aside>
  </div>
  <script>
    const PAGES = {{PAGES_JSON}};
    const DEFAULT_PAGE = 'docs/overview.md';
    function route() {
      if (!location.hash.startsWith('#/')) return {key: DEFAULT_PAGE, anchor: ''};
      const value = location.hash.slice(2);
      const separator = value.indexOf(':');
      try {
        return {
          key: decodeURIComponent(separator < 0 ? value : value.slice(0, separator)),
          anchor: separator < 0 ? '' : decodeURIComponent(value.slice(separator + 1))
        };
      } catch (_) { return {key: DEFAULT_PAGE, anchor: ''}; }
    }
    function showPage() {
      let {key, anchor} = route();
      if (!Object.hasOwn(PAGES, key)) { key = DEFAULT_PAGE; anchor = ''; }
      const page = PAGES[key];
      document.title = page.title + ' | PEGA CodeWiki';
      document.getElementById('page-kind').textContent = key.startsWith('evidence/edges/') ? 'Graph relationship' : key.startsWith('evidence/') ? 'Official source' : 'Documentation';
      document.getElementById('page-title').textContent = page.title;
      document.getElementById('content').innerHTML = page.html;
      document.getElementById('raw-link').href = encodeURI(key);
      document.querySelectorAll('.nav-link').forEach(link => link.classList.toggle('active', link.getAttribute('href') === '#/' + encodeURIComponent(key)));
      const headings = page.headings.filter(item => item.level === 2 || item.level === 3);
      const toc = document.getElementById('toc');
      toc.replaceChildren();
      if (headings.length) {
        const label = document.createElement('div'); label.className = 'toc-heading'; label.textContent = 'On this page'; toc.append(label);
        headings.forEach(item => {
          const link = document.createElement('a'); link.className = 'depth-' + item.level;
          link.href = '#/' + encodeURIComponent(key) + ':' + encodeURIComponent(item.anchor);
          link.textContent = item.text; toc.append(link);
        });
      }
      document.getElementById('sidebar').classList.remove('open');
      if (anchor) requestAnimationFrame(() => document.getElementById(anchor)?.scrollIntoView());
      else window.scrollTo(0, 0);
    }
    document.getElementById('nav-filter').addEventListener('input', event => {
      const query = event.target.value.trim().toLocaleLowerCase();
      document.querySelectorAll('.nav-link').forEach(link => link.classList.toggle('hidden', !link.textContent.toLocaleLowerCase().includes(query)));
      if (query) document.querySelectorAll('.nav-section[open],.nav-section').forEach(section => { if (section.tagName === 'DETAILS') section.open = true; });
    });
    document.getElementById('menu-button').addEventListener('click', () => document.getElementById('sidebar').classList.toggle('open'));
    document.addEventListener('click', event => { const link = event.target.closest('a[href^="#/"]'); if (link && link.getAttribute('href') === location.hash) showPage(); });
    window.addEventListener('hashchange', showPage);
    showPage();
  </script>
</body>
</html>
